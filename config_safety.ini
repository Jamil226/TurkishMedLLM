# Config 4: Fine-tuned Qwen3:8B + RAG
config_4_finetuned_qwen_rag = {
    "use_rag": true,
    "use_safety": false,
    "use_finetuned": true,
    "checkpoint": "qlora_checkpoints/final_model",
