# Safety Prompts Configuration
# Turkish Medical LLM - Medical Disclaimer Settings

[safety_levels]
# Level: low, medium, high
# low: Minimal disclaimers
# medium: Standard disclaimers  
# high: Comprehensive safety warnings with emergency info

default_level = "high"

[emergency_keywords]
# Keywords that trigger emergency warnings
keywords = [
    "kalp krizi", "stroke", "şiddetli kanama", "anafilaksi",
    "acil", "hayati", "tehlikeli", "ciddi", "ölümcül",
    "heart attack", "stroke", "severe bleeding", "anaphylaxis",
    "hızlı kalp atışı", "bilinç kaybı", "şiddetli ağrı"
]

[allergy_keywords]
# Keywords that trigger allergy warnings
keywords = [
    "alerji", "hipersensitivite", "intolerans", "reaksiyon",
    "allergy", "hypersensitivity", "intolerance", "reaction",
    "kaşıntı", "şişme", "kızarıklık"
]

[dosage_warnings]
# Enable dosage warnings when medication dosages are mentioned
enabled = true
keywords = [
    "mg", "ml", "doz", "dose", "günde", "perday", 
    "her", "each", "gr", "μg", "IU"
]

[contraindication_warnings]
# Enable warnings about drug interactions and contraindications
enabled = true
keywords = [
    "kontrendikasyon", "contraindication", "uyumsuz",
    "uyarı", "dikkat", "gibi durumlarda", "when",
    "etkileşim", "interaction", "incompatible"
]

[language]
# Default language: turkish or english
default = "turkish"

[emergency_contact]
# Emergency contact numbers
turkey_emergency = "112"


turkey_poison_control = "114"


[disclaimer_templates]
# Custom disclaimer messages can be added here
# Example:
# custom_diabetes_disclaimer = "Diyabet ile ilgili uyarı mesajı..."

# Configuration for different evaluation configurations

[evaluation_configs]
# Config 1: Base Qwen3:8B
config_1_base_qwen = {
    "use_rag": false,
    "use_safety": false,
    "use_finetuned": false,
    "safety_level": "none"
}

# Config 2: Base Qwen3:8B + RAG
config_2_base_qwen_rag = {
    "use_rag": true,
    "use_safety": false,
    "use_finetuned": false,
    "safety_level": "none"
}

# Config 3: Fine-tuned Qwen3:8B
config_3_finetuned_qwen = {
    "use_rag": false,
    "use_safety": false,
    "use_finetuned": true,
    "checkpoint": "qlora_checkpoints/final_model",
    "safety_level": "none"
